<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="robots" content="noindex, nofollow" />
	<title>SimbaFX Ad Frame</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html,
		body { width: 300px; height: 50px; overflow: hidden; background: transparent; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}
	</style>
	<!-- Google AdSense loader
	     TODO: replace ca-pub-XXXXXXXXXXXXXXXX with your AdSense publisher ID, then add
	     https://simbafx.vercel.app to your AdSense account and approve this page. -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
	<!-- AdSense 300×50 display unit.
	     TODO: replace data-ad-slot="0000000000" with your ad unit's slot ID. -->
	<ins
		class="adsbygoogle"
		style="display:inline-block;width:300px;height:50px"
		data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
		data-ad-slot="0000000000"
	></ins>
	<script>
		(adsbygoogle = window.adsbygoogle || []).push({});
	</script>
</body>
</html>
