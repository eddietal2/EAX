<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="EAX - Fast and accurate currency exchange rates for East African currencies. Convert between TZS, USD, EUR, GBP, KES and more. Real-time rates with detailed exchange information." />
		<meta name="theme-color" content="#10b981" />
		<link rel="manifest" href="/manifest.json" />
		<title>EAX - Currency Exchange Rates</title>
		<!-- Only preload the LCP font (Bebas Neue for h1), Space Grotesk loads on demand via font-display: swap -->
		<link rel="preload" href="/fonts/BebasNeue-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Critical CSS for LCP element (h1) to render immediately -->
		<style>
			@font-face {
				font-family: 'Bebas Neue';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('/fonts/BebasNeue-latin.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Space Grotesk';
				font-style: normal;
				font-weight: 400 800;
				font-display: swap;
				src: url('/fonts/SpaceGrotesk-latin.woff2') format('woff2');
			}
			h1 {
				font-family: 'Bebas Neue', 'Courier New', monospace;
				font-size: 1.875rem;
				font-weight: 900;
				letter-spacing: 0.05em;
				color: #059669;
			}
			.dark h1 {
				color: #34d399;
			}
		</style>
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#10b981" />
		%sveltekit.head%
		<script>
			// Initialize theme before rendering to prevent flash
			const theme = localStorage.getItem('appTheme') || 'system';
			const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			const resolved = theme === 'system' ? getSystemTheme() : theme;
			if (resolved === 'dark') document.documentElement.classList.add('dark');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
