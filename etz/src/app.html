<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="EAX - Fast and accurate currency exchange rates for East African currencies. Convert between TZS, USD, EUR, GBP, KES and more. Real-time rates with detailed exchange information." />
		<title>EAX - Currency Exchange Rates</title>
		<!-- Font preconnection and preload for performance -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" />
		<!-- Critical CSS for LCP element (h1) to render immediately -->
		<style>
			h1 {
				font-family: 'Bebas Neue', 'Courier New', monospace;
				font-size: 1.875rem;
				font-weight: 900;
				letter-spacing: 0.05em;
				color: #059669;
			}
			.dark h1 {
				color: #34d399;
			}
		</style>
		%sveltekit.head%
		<script>
			// Initialize theme before rendering to prevent flash
			const theme = localStorage.getItem('appTheme') || 'system';
			const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			const resolved = theme === 'system' ? getSystemTheme() : theme;
			if (resolved === 'dark') document.documentElement.classList.add('dark');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
